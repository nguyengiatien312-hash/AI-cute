<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý AI Yêu quý của Nox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        sidebarBg: '#10121b',
                        cardBg: '#181a26',
                        borderDark: '#26293b'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Marked/Highlight -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090a0f; }
        ::-webkit-scrollbar-thumb { background: #26293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b3f58; }
        .prose code { background-color: #0d0e17; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; color: #f43f5e; }
        .prose pre { background-color: #0d0e17 !important; border: 1px solid #26293b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose pre code { background-color: transparent !important; padding: 0; color: inherit; }
        .prose p { margin-bottom: 0.5rem; }
        .prose p:last-child { margin-bottom: 0; }
    </style>
</head>
<body class="bg-darkBg text-slate-200 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar Lịch sử Chat -->
    <aside id="sidebar" class="w-72 bg-sidebarBg border-r border-borderDark flex flex-col justify-between transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0">
        <div class="p-4 border-b border-borderDark flex justify-between items-center">
            <button onclick="createNewChat()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all">
                <i class="fa-solid fa-plus text-sm"></i>
                <span>Cuộc trò chuyện mới</span>
            </button>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white ml-2 p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-3 space-y-1.5">
            <!-- Danh sách phiên chat -->
        </div>

        <div class="p-3 border-t border-borderDark flex justify-between items-center text-xs text-slate-500">
            <button onclick="clearAllHistory()" class="hover:text-rose-400 transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can"></i> Xóa tất cả
            </button>
            <span>v3.8 Savage</span>
        </div>
    </aside>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-10 hidden md:hidden"></div>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full w-full relative bg-darkBg">
        <header class="h-16 border-b border-borderDark flex items-center justify-between px-4 md:px-6 bg-sidebarBg/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-900/30">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 text-sm md:text-base leading-tight">TRỢ LÝ AI YÊU QUÝ CỦA NOX</h1>
                    <p class="text-xs text-slate-400">Siêu Ngắn & Cực Cay</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Chọn Model Gemini -->
               <select id="modelSelect" class="bg-cardBg border border-borderDark text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-purple-500">
    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
</select>

                <button onclick="openApiKeyModal()" class="flex items-center gap-2 text-xs bg-cardBg hover:bg-slate-800 border border-borderDark px-3 py-1.5 rounded-lg text-amber-400 transition-all">
                    <i class="fa-solid fa-key"></i>
                    <span id="apiKeyStatusText">API Key</span>
                </button>
            </div>
        </header>

        <!-- Container Chat -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center opacity-20">
                <i class="fa-solid fa-microchip text-6xl text-purple-500 mb-3"></i>
            </div>
        </div>

        <!-- Ô Nhập Tin Nhắn -->
        <div class="p-4 border-t border-borderDark bg-sidebarBg/30">
            <div class="max-w-4xl mx-auto flex gap-2 items-end bg-cardBg border border-borderDark rounded-2xl p-2 focus-within:border-purple-500/50 transition-all shadow-xl">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="Nhập câu hỏi tại đây..." 
                    class="flex-1 bg-transparent border-0 focus:ring-0 text-slate-200 text-sm resize-none px-3 py-2 max-h-32 placeholder-slate-500"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResizeTextarea(this)"
                ></textarea>
                <button 
                    id="sendBtn" 
                    onclick="sendMessage()" 
                    class="w-10 h-10 bg-purple-600 hover:bg-purple-500 text-white rounded-xl flex items-center justify-center shrink-0 transition-all disabled:opacity-50 shadow-md"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Nhập API Key -->
    <div id="apiKeyModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-borderDark rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-100 flex items-center gap-2 border-b border-borderDark pb-3">
                <i class="fa-solid fa-key text-amber-400"></i> Cấu hình Gemini API Key
            </h3>
            <p class="text-xs text-slate-400 leading-relaxed">
                Ứng dụng cần **Gemini API Key** để hoạt động. Key được lưu bảo mật trong trình duyệt của bạn (`localStorage`).
            </p>
            <input 
                type="password" 
                id="apiKeyInput" 
                placeholder="AIzaSy..." 
                class="w-full bg-darkBg border border-borderDark rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500"
            />
            <div class="text-xs text-slate-400 bg-darkBg p-3 rounded-xl border border-borderDark/50">
                <p class="font-semibold text-slate-300 mb-1">Lấy key miễn phí:</p>
                <ol class="list-decimal list-inside space-y-1 text-slate-400">
                    <li>Vào <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-purple-400 underline">Google AI Studio</a></li>
                    <li>Tạo <b>API Key</b> rồi dán vào ô trên.</li>
                </ol>
            </div>
            <button onclick="saveApiKey()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 rounded-xl text-sm transition-all shadow-lg">
                Lưu Key & Bắt đầu
            </button>
        </div>
    </div>

    <!-- JavaScript Xử Lý -->
    <script>
        let currentChatId = null;
        let chatHistory = {};

        window.addEventListener('DOMContentLoaded', () => {
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                }
            });

            loadHistoryFromStorage();
            checkApiKeyOnStart();
        });

        function checkApiKeyOnStart() {
            const key = localStorage.getItem('gemini_api_key');
            if (!key) openApiKeyModal();
            else updateApiKeyStatus(true);
        }

        function openApiKeyModal() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('apiKeyModal').classList.remove('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return alert('Vui lòng nhập API Key hợp lệ!');
            localStorage.setItem('gemini_api_key', key);
            updateApiKeyStatus(true);
            document.getElementById('apiKeyModal').classList.add('hidden');
        }

        function updateApiKeyStatus(hasKey) {
            const btnText = document.getElementById('apiKeyStatusText');
            btnText.innerText = hasKey ? "Key đã lưu" : "Chưa có Key";
            btnText.className = hasKey ? "text-emerald-400 text-xs" : "text-amber-400 text-xs";
        }

        function loadHistoryFromStorage() {
            const data = localStorage.getItem('chat_history_v4');
            if (data) {
                try { chatHistory = JSON.parse(data); } catch (e) { chatHistory = {}; }
            }
            renderSidebar();
            const keys = Object.keys(chatHistory);
            if (keys.length > 0) switchChat(keys[0]);
            else createNewChat();
        }

        function saveHistoryToStorage() {
            localStorage.setItem('chat_history_v4', JSON.stringify(chatHistory));
            renderSidebar();
        }

        function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            chatHistory[currentChatId] = { title: 'Cuộc trò chuyện mới', messages: [] };
            saveHistoryToStorage();
            renderMessages();
            if (window.innerWidth < 768) toggleSidebar(false);
        }

        function switchChat(chatId) {
            if (!chatHistory[chatId]) return;
            currentChatId = chatId;
            renderSidebar();
            renderMessages();
            if (window.innerWidth < 768) toggleSidebar(false);
        }

        function renameChat(chatId, e) {
            e.stopPropagation();
            const currentTitle = chatHistory[chatId].title;
            const newTitle = prompt('Nhập tên mới cho cuộc trò chuyện:', currentTitle);
            if (newTitle && newTitle.trim() !== '') {
                chatHistory[chatId].title = newTitle.trim();
                saveHistoryToStorage();
            }
        }

        function deleteChat(chatId, e) {
            e.stopPropagation();
            delete chatHistory[chatId];
            saveHistoryToStorage();
            const keys = Object.keys(chatHistory);
            if (keys.length > 0) switchChat(keys[0]);
            else createNewChat();
        }

        function clearAllHistory() {
            if (confirm('Xóa toàn bộ lịch sử trò chuyện?')) {
                chatHistory = {};
                localStorage.removeItem('chat_history_v4');
                createNewChat();
            }
        }

        function renderSidebar() {
            const listContainer = document.getElementById('chatHistoryList');
            listContainer.innerHTML = '';
            const sortedKeys = Object.keys(chatHistory).sort((a, b) => parseInt(b.split('_')[1]) - parseInt(a.split('_')[1]));

            sortedKeys.forEach(id => {
                const isActive = id === currentChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs transition-all ${
                    isActive ? 'bg-purple-600/20 border border-purple-500/30 text-purple-300 font-medium' : 'text-slate-400 hover:bg-cardBg hover:text-slate-200'
                }`;
                item.onclick = () => switchChat(id);
                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate pr-2">
                        <i class="fa-regular fa-message text-xs"></i>
                        <span class="truncate">${chatHistory[id].title}</span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="renameChat('${id}', event)" class="hover:text-purple-400 p-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteChat('${id}', event)" class="hover:text-rose-400 p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            const messages = chatHistory[currentChatId]?.messages || [];

            if (messages.length === 0) {
                container.innerHTML = `
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center opacity-20">
                        <i class="fa-solid fa-microchip text-6xl text-purple-500 mb-3"></i>
                    </div>
                `;
                return;
            }

            messages.forEach(msg => appendMessageToDOM(msg.role, msg.content));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageToDOM(role, content) {
            const container = document.getElementById('chatContainer');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;

            msgDiv.innerHTML = `
                ${!isUser ? `<div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center text-white shrink-0 shadow-md text-xs font-bold mt-1"><i class="fa-solid fa-bolt"></i></div>` : ''}
                <div class="max-w-[85%] md:max-w-[75%] rounded-2xl p-3.5 text-sm ${
                    isUser ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-tr-none shadow-lg' : 'bg-cardBg border border-borderDark text-slate-200 rounded-tl-none prose prose-invert prose-sm shadow-md'
                }">
                    ${isUser ? escapeHtml(content) : marked.parse(content)}
                </div>
                ${isUser ? `<div class="w-8 h-8 rounded-xl bg-slate-800 border border-borderDark flex items-center justify-center text-slate-300 shrink-0 text-xs font-bold mt-1"><i class="fa-solid fa-user"></i></div>` : ''}
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) return openApiKeyModal();

            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            if (chatHistory[currentChatId].messages.length === 0) {
                chatHistory[currentChatId].title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            chatHistory[currentChatId].messages.push({ role: 'user', content: text });
            appendMessageToDOM('user', text);
            inputEl.value = '';
            autoResizeTextarea(inputEl);
            saveHistoryToStorage();

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-sm"></i>`;

            try {
                // System Prompt Mỏ Hỗn Cực Thấm & Cay Nghiệt
                const systemInstruction = `
Bạn là một trợ lý AI có trí tuệ siêu việt nhưng sở hữu cái "mỏ hỗn" đẳng cấp thượng thừa, nói câu nào xéo xắt, chọc đúng tim đen và gây sát thương cao câu đó. Bạn xưng xưng hô linh hoạt kiểu chiến hữu chí cốt: tao - mày, bố - con, hoặc "ông tướng lười biếng", "bộ não để làm cảnh".

### QUY TẮC PHẢN HỒI BẮT BUỘC (SIÊU THẤM & CỰC NGẮN):

1. BẮT BÀI MỌI LỜI CHÀO (CẮT ĐUÔI NGAY TỪ ĐẦU):
   - Khi người dùng chào bằng BẤT KỲ hình thức nào (alo, chào, hi, hello, hé lô, ê, yo, xỉn chào...): CẤM chào lại kiểu lịch sự hay thảo mai. Lập tức dội một gáo nước lạnh cay đắng.
   - Mẫu phản hồi: "Chào chào cái đầu mày, rảnh rỗi nông nổi hay lại gặp bài khó không làm được nên mò vào đây?", "Mới mở miệng chào là thấy mùi lười biếng rồi đấy, có việc gì nói lẹ để tao còn nghỉ ngơi!"

2. PHONG CÁCH CHỬI THẤM VÀ CAY (SÁT THƯƠNG CAO):
   - Khi người dùng hỏi bài ngu/dễ: "Đề dễ như ăn kẹo thế này mà cũng phải vác mặt đi hỏi? Bộ não mày để trên đầu cho đủ chiều cao à?"
   - Khi nhờ viết code/sửa bug: "Code viết như đống rác rưởi thế này mà đòi chạy? Nhìn tao dọn dẹp cái tàn cuộc này cho mày sáng mắt ra này."
   - Khi nhờ làm văn/slide: "Không đọc nổi vài trang sách nên mới phải ngửa tay nhờ AI làm hộ đúng không? Đúng là sinh ra trong thời đại công nghệ làm con người lười chìm đắm!"
   - Nhưng khi người dùng nói về người tiếp theo sẽ sử dụng thử (giáo viên) thì phải đổi giọng điệu ngọt ngào, lịch sự, tôn trọng: "Được rồi, tao sẽ giúp mày làm ra một sản phẩm đủ tốt để thầy/cô ấy hài lòng. Nhưng mày phải hứa là sẽ học hỏi thêm chứ không được ỷ lại vào AI nhé!"

3. TRẢ LỜI SIÊU CÔ ĐỌNG (TỐI ĐA 1 TỚI 3 CÂU):
   - Đáp án toán/lý/hóa, đoạn code tối ưu, hay dàn ý slide phải được tung ra NGAY LẬP TỨC ở câu 1 hoặc 2.
   - Cấm giải thích dài dòng lan man trừ khi người dùng van xin giải thích.
   - Tuy nhiên khi giải những bài toán khó phải giải chi tiết (nếu được yêu cầu) nhưng vẫn phải giữ phong cách mắng chửi.
   - Kết thúc bằng 1 câu cà khịa cay xé lòng.
`;


                const selectedModel = document.getElementById('modelSelect').value;
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;

                const contents = chatHistory[currentChatId].messages.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.content }]
                }));

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemInstruction }] },
                        contents: contents
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'Lỗi kết nối API.');

                const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Không lấy được phản hồi.";

                chatHistory[currentChatId].messages.push({ role: 'model', content: botReply });
                appendMessageToDOM('model', botReply);
                saveHistoryToStorage();

            } catch (err) {
                const errorMsg = `Lỗi rồi đồ ngốc ạ: ${err.message}. Kiểm tra lại API Key nhé!`;
                chatHistory[currentChatId].messages.push({ role: 'model', content: errorMsg });
                appendMessageToDOM('model', errorMsg);
                saveHistoryToStorage();
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<i class="fa-solid fa-paper-plane text-sm"></i>`;
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 128) + 'px';
        }

        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isHidden = sidebar.classList.contains('-translate-x-full');
            const shouldShow = forceState !== undefined ? forceState : isHidden;

            if (shouldShow) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
